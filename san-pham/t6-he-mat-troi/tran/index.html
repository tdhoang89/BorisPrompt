<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hệ Mặt Trời 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed WebGL sky; small instrument panels pinned to the corners; planet dossier docks right on desktop, slides up as a bottom sheet on phones */
:root {
  --void: #04060c;
  --ink: #ebe7de;
  --dim: #8a92a6;
  --line: rgba(150, 168, 210, 0.18);
  --panel: rgba(8, 12, 22, 0.82);
  --solar: #f2a23a;
  --solar-soft: rgba(242, 162, 58, 0.16);
  --f-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, "Courier New", monospace;
  --gutter: 16px;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--void); color: var(--ink); font-family: var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--solar); outline-offset: 2px; }

#scene { position: fixed; inset: 0; }
#scene canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.lbl {
  position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
  background: none; border: 0; padding: 2px 6px; white-space: nowrap;
  font-size: 11px; font-weight: 500; letter-spacing: 0.04em; color: var(--ink);
  text-shadow: 0 1px 3px var(--void), 0 0 8px var(--void); opacity: 0.85;
  will-change: transform;
}
.lbl:hover { opacity: 1; color: var(--solar); }
.lbl.on { color: var(--solar); opacity: 1; }
body.no-labels #labels { display: none; }

/* top-left: name, sim date, body chips */
.hud-top {
  position: fixed; top: calc(var(--gutter) + env(safe-area-inset-top, 0px)); left: var(--gutter); right: var(--gutter);
  display: flex; flex-direction: column; gap: 10px; pointer-events: none;
}
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.brand h1 {
  margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1;
  text-transform: uppercase; letter-spacing: 0.05em; text-wrap: balance;
}
.brand h1 b { color: var(--solar); font-weight: 700; }
.date { margin: 0; font-family: var(--f-mono); font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
.date span { color: var(--ink); }
.chips {
  display: flex; gap: 6px; overflow-x: auto; pointer-events: auto; max-width: 100%;
  scrollbar-width: none; padding-bottom: 2px;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  padding: 6px 11px 6px 9px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  font-size: 12.5px; color: var(--ink); transition: border-color .2s, background .2s;
}
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.chip:hover { border-color: rgba(242, 162, 58, 0.5); }
.chip[aria-pressed="true"] { border-color: var(--solar); background: var(--solar-soft); }

/* bottom-left: time + view controls */
.hud-bottom {
  position: fixed; left: var(--gutter); bottom: calc(var(--gutter) + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - 2 * var(--gutter));
  display: flex; flex-direction: column; gap: 8px;
}
.bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 12px 8px 8px; border: 1px solid var(--line); border-radius: 14px;
  background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.play {
  width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--solar-soft);
  display: grid; place-items: center; cursor: pointer; color: var(--solar);
}
.play svg { width: 14px; height: 14px; fill: currentColor; }
.speed { display: flex; align-items: center; gap: 10px; }
.speed input { width: 150px; accent-color: var(--solar); }
.speed output { font-family: var(--f-mono); font-size: 12px; min-width: 108px; color: var(--ink); font-variant-numeric: tabular-nums; }
.txtbtn {
  border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 10px;
  font-size: 12.5px; cursor: pointer;
}
.txtbtn:hover { border-color: var(--solar); color: var(--solar); }
.sep { width: 1px; align-self: stretch; background: var(--line); }
.toggles { display: flex; gap: 12px; }
.toggles label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--dim); cursor: pointer; }
.toggles input { accent-color: var(--solar); margin: 0; }
.hint { margin: 0; font-size: 12px; color: var(--dim); transition: opacity .8s; padding-left: 4px; }
.hint.gone { opacity: 0; }
.note {
  position: fixed; right: var(--gutter); bottom: calc(var(--gutter) + env(safe-area-inset-bottom, 0px));
  margin: 0; font-size: 11px; color: var(--dim); max-width: 220px; text-align: right; line-height: 1.4;
}

/* planet dossier */
.info {
  position: fixed; top: calc(var(--gutter) + env(safe-area-inset-top, 0px)); right: var(--gutter);
  width: 340px; max-height: calc(100% - 2 * var(--gutter) - 40px); overflow-y: auto;
  padding: 22px 22px 20px; border: 1px solid var(--line); border-radius: 16px;
  background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  display: flex; flex-direction: column; gap: 14px;
  animation: slideIn .35s cubic-bezier(.2,.8,.2,1);
}
@keyframes slideIn { from { transform: translateX(16px); opacity: .4; } to { transform: none; opacity: 1; } }
.close {
  position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 8px;
  border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 18px; line-height: 1; color: var(--dim);
}
.close:hover { color: var(--ink); border-color: var(--ink); }
.eyebrow { margin: 0; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--solar); padding-right: 36px; }
.info h2 {
  margin: -6px 0 0; font-family: var(--f-display); font-weight: 700; font-size: 52px; line-height: 0.92;
  text-transform: uppercase; letter-spacing: 0.01em; text-wrap: balance;
}
.alt { margin: -8px 0 0; font-size: 12px; color: var(--dim); letter-spacing: 0.04em; }
.desc { margin: 0; font-size: 14px; line-height: 1.6; color: var(--ink); }
.compare { display: flex; flex-direction: column; gap: 4px; }
.compare svg { width: 100%; height: 76px; display: block; }
.compare p { margin: 0; font-size: 12px; color: var(--dim); }
.compare p b { color: var(--ink); font-weight: 600; font-family: var(--f-mono); }
.stats { margin: 0; display: grid; grid-template-columns: auto 1fr; }
.stats dt, .stats dd { padding: 8px 0; border-top: 1px solid var(--line); margin: 0; }
.stats dt { font-size: 12px; color: var(--dim); padding-right: 12px; }
.stats dd { font-family: var(--f-mono); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
body.dossier .note { display: none; }
.stats dd.live { color: var(--solar); }
.fact { border-top: 1px solid var(--line); padding-top: 12px; }
.fact span { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--solar); }
.fact p { margin: 6px 0 0; font-size: 13.5px; line-height: 1.6; }
.foot { margin: 0; font-size: 11px; color: var(--dim); line-height: 1.5; }

@media (max-width: 760px) {
  .brand h1 { font-size: 24px; }
  .info {
    top: auto; right: 0; left: 0; bottom: 0; width: auto; max-height: 56%;
    border-radius: 18px 18px 0 0; border-bottom: 0;
    padding: 18px var(--gutter) calc(18px + env(safe-area-inset-bottom, 0px));
    animation-name: sheetIn;
  }
  @keyframes sheetIn { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
  .info h2 { font-size: 42px; }
  .note { display: none; }
  .speed input { width: 110px; }
  .speed output { min-width: 96px; }
  .sep { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .info { animation: none; }
  .hint, .chip { transition: none; }
}
</style>
</head>
<body>
<div id="scene" aria-label="Mô phỏng 3D hệ Mặt Trời. Kéo để xoay, cuộn hoặc chụm để phóng to." role="img"></div>
<div id="labels"></div>

<div class="hud-top">
  <div class="brand">
    <h1>Hệ Mặt <b>Trời</b></h1>
    <p class="date">Ngày mô phỏng: <span id="date">—</span></p>
  </div>
  <nav class="chips" id="chips" aria-label="Chọn thiên thể"></nav>
</div>

<div class="hud-bottom">
  <p class="hint" id="hint"></p>
  <div class="bar">
    <button class="play" id="play" type="button" aria-label="Tạm dừng"></button>
    <div class="speed">
      <input type="range" id="speed" min="0" max="1000" step="1" aria-label="Tốc độ thời gian">
      <output id="speedOut" for="speed"></output>
    </div>
    <button class="txtbtn" id="today" type="button">Hôm nay</button>
    <span class="sep" aria-hidden="true"></span>
    <div class="toggles">
      <label><input type="checkbox" id="tOrbits" checked> Quỹ đạo</label>
      <label><input type="checkbox" id="tLabels" checked> Tên</label>
    </div>
  </div>
</div>
<p class="note">Kích thước và khoảng cách đã được thu gọn để dễ xem. Vị trí các hành tinh ứng với ngày mô phỏng (gần đúng, quỹ đạo tròn).</p>

<aside class="info" id="info" hidden aria-live="polite">
  <button class="close" id="close" type="button" aria-label="Đóng thông tin">×</button>
  <p class="eyebrow" id="iEyebrow"></p>
  <h2 id="iName"></h2>
  <p class="alt" id="iAlt"></p>
  <p class="desc" id="iDesc"></p>
  <div class="compare" id="iCompare">
    <svg viewBox="0 0 300 76" preserveAspectRatio="xMinYMid meet" aria-hidden="true"><g id="iCmpG"></g></svg>
    <p id="iCmpTxt"></p>
  </div>
  <dl class="stats" id="iStats"></dl>
  <div class="fact"><span>Bạn có biết</span><p id="iFact"></p></div>
  <p class="foot" id="iFoot"></p>
</aside>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
'use strict';
const DEG = Math.PI / 180;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;
const J2000 = Date.UTC(2000, 0, 1, 12);
const nowDays = () => (Date.now() - J2000) / 864e5;
const sceneDist = au => 2 + 18 * Math.sqrt(au);   // nén khoảng cách để nhìn được cả hệ
const AU_KM = 149597871;

/* ---------- procedural noise ---------- */
function makeFbm(seed) {
  const h = (x, y, z) => {
    let n = Math.imul(x, 0x27d4eb2d) ^ Math.imul(y, 0x165667b1) ^ Math.imul(z, 0x9e3779b1) ^ seed;
    n = Math.imul(n ^ (n >>> 15), 0x85ebca6b);
    n = Math.imul(n ^ (n >>> 13), 0xc2b2ae35);
    n ^= n >>> 16;
    return (n >>> 0) / 4294967296;
  };
  const noise = (x, y, z) => {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const xf = x - xi, yf = y - yi, zf = z - zi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
    const a = h(xi, yi, zi), b = h(xi + 1, yi, zi), c = h(xi, yi + 1, zi), d = h(xi + 1, yi + 1, zi);
    const e = h(xi, yi, zi + 1), f = h(xi + 1, yi, zi + 1), g = h(xi, yi + 1, zi + 1), k = h(xi + 1, yi + 1, zi + 1);
    const x1 = a + (b - a) * u, x2 = c + (d - c) * u, x3 = e + (f - e) * u, x4 = g + (k - g) * u;
    const y1 = x1 + (x2 - x1) * v, y2 = x3 + (x4 - x3) * v;
    return y1 + (y2 - y1) * w;
  };
  return (x, y, z, oct = 5) => {
    let amp = 0.5, fr = 1, sum = 0, norm = 0;
    for (let o = 0; o < oct; o++) {
      sum += amp * noise(x * fr + 31.7, y * fr + 17.3, z * fr + 5.1);
      norm += amp; amp *= 0.5; fr *= 2.03;
    }
    return sum / norm;
  };
}
const hex = s => [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)];
const clamp = (t, a = 0, b = 1) => Math.min(b, Math.max(a, t));
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const R = stops => stops.map(([t, c]) => [t, hex(c)]);
function ramp(stops, t) {
  t = clamp(t);
  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) {
      const [t0, c0] = stops[i - 1], [t1, c1] = stops[i];
      return mixc(c0, c1, (t - t0) / (t1 - t0 || 1));
    }
  }
  return stops[stops.length - 1][1];
}
function sphereTex(w, h, shade) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h), d = img.data;
  for (let j = 0; j < h; j++) {
    const lat = (0.5 - (j + 0.5) / h) * Math.PI, cl = Math.cos(lat), sl = Math.sin(lat);
    for (let i = 0; i < w; i++) {
      const lon = ((i + 0.5) / w) * 2 * Math.PI;
      const col = shade(cl * Math.cos(lon), sl, cl * Math.sin(lon), lat, lon);
      const k = (j * w + i) * 4;
      d[k] = col[0]; d[k + 1] = col[1]; d[k + 2] = col[2]; d[k + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return t;
}

/* ---------- surface painters ---------- */
const SHADERS = {
  sun() {
    const f = makeFbm(11), S = R([[0, '#c2511a'], [0.4, '#f08a24'], [0.7, '#ffc75a'], [1, '#fff3c8']]);
    return (x, y, z) => ramp(S, (f(x * 7, y * 7, z * 7, 4) + 0.45 * (f(x * 24, y * 24, z * 24, 2) - 0.5) - 0.28) / 0.44);
  },
  mercury() {
    const f = makeFbm(21), g = makeFbm(22), S = R([[0, '#4c4843'], [0.5, '#8a847b'], [1, '#c4bdb2']]);
    return (x, y, z) => {
      let c = ramp(S, (f(x * 3, y * 3, z * 3, 5) - 0.3) / 0.4);
      const k = g(x * 12, y * 12, z * 12, 3);
      if (k > 0.6) c = mixc(c, [58, 54, 50], clamp((k - 0.6) * 5) * 0.6);
      return c;
    };
  },
  venus() {
    const f = makeFbm(31), g = makeFbm(32), S = R([[0, '#a77a35'], [0.5, '#d8b46c'], [1, '#f2e2b4']]);
    return (x, y, z) => {
      const w = f(x * 2, y * 2, z * 2, 4);
      return ramp(S, (g(x * 1.5 + w * 2, y * 6, z * 1.5 + w * 2, 5) - 0.3) / 0.4);
    };
  },
  earth() {
    const f = makeFbm(41), g = makeFbm(42), h = makeFbm(43);
    const deep = hex('#0a2350'), shallow = hex('#1f5c9f'), green = hex('#33632e'), dry = hex('#a58f5e'), rock = hex('#75664d');
    return (x, y, z, lat) => {
      const e = f(x * 1.8, y * 1.8, z * 1.8, 6), alat = Math.abs(lat) / DEG;
      let c;
      if (e > 0.52) {
        const veg = g(x * 3, y * 3, z * 3, 3) * (alat < 35 ? 1.12 : 0.85);
        c = mixc(green, dry, clamp((veg - 0.45) * 3));
        c = mixc(c, rock, clamp((e - 0.52) / 0.18 - 0.5));
      } else {
        const k = e / 0.52;
        c = mixc(deep, shallow, k * k * k);
      }
      const ice = alat + (g(x * 5, y * 5, z * 5, 2) - 0.5) * 14;
      if (ice > 70) c = mixc(c, [236, 242, 246], clamp((ice - 70) / 4));
      const cl = h(x * 3, y * 6, z * 3, 5);
      if (cl > 0.53) c = mixc(c, [246, 248, 250], clamp((cl - 0.53) * 3.4) * 0.85);
      return c;
    };
  },
  moon() {
    const f = makeFbm(51), g = makeFbm(52), S = R([[0, '#55524e'], [0.5, '#8f8b85'], [1, '#bdb8b0']]);
    return (x, y, z) => {
      const n = f(x * 2, y * 2, z * 2, 4);
      let c = ramp(S, (f(x * 6, y * 6, z * 6, 4) - 0.3) / 0.4);
      if (n < 0.46) c = mixc(c, [70, 68, 66], clamp((0.46 - n) * 8) * 0.7);
      const k = g(x * 14, y * 14, z * 14, 2);
      if (k > 0.66) c = mixc(c, [200, 196, 188], clamp((k - 0.66) * 6) * 0.5);
      return c;
    };
  },
  mars() {
    const f = makeFbm(61), g = makeFbm(62), S = R([[0, '#5e2817'], [0.35, '#9c4428'], [0.65, '#c66a3c'], [1, '#dd9563']]);
    return (x, y, z, lat) => {
      let c = ramp(S, (f(x * 2.5, y * 2.5, z * 2.5, 6) - 0.28) / 0.44);
      const ice = Math.abs(lat) / DEG + (g(x * 6, y * 6, z * 6, 2) - 0.5) * 8;
      if (ice > 80) c = mixc(c, [242, 232, 222], clamp((ice - 80) / 3));
      return c;
    };
  },
  jupiter() {
    const f = makeFbm(71), S = R([[0, '#8a5636'], [0.35, '#c39a72'], [0.7, '#e8d6ba'], [1, '#f4ead8']]), spot = hex('#b4502b');
    return (x, y, z, lat, lon) => {
      const w = f(x * 3, y * 3, z * 3, 4);
      const b = Math.sin(y * 20 + (w - 0.5) * 5) * 0.5 + 0.5, b2 = Math.sin(y * 7 + 1.3) * 0.5 + 0.5;
      let c = ramp(S, b * 0.7 + b2 * 0.3);
      let dl = lon - 1.2; dl = Math.atan2(Math.sin(dl), Math.cos(dl));
      const dx = (dl * Math.cos(lat)) / 0.2, dy = (lat + 22 * DEG) / 0.1, e = dx * dx + dy * dy;
      if (e < 1) c = mixc(c, spot, Math.sqrt(1 - e) * 0.85);
      return c;
    };
  },
  saturn() {
    const f = makeFbm(81), S = R([[0, '#b2925b'], [0.5, '#d9c290'], [1, '#efe3c2']]);
    return (x, y, z) => ramp(S, Math.sin(y * 16 + (f(x * 3, y * 3, z * 3, 4) - 0.5) * 2) * 0.5 + 0.5);
  },
  uranus() {
    const f = makeFbm(91), S = R([[0, '#7cbfca'], [0.5, '#a6dde4'], [1, '#c6edf0']]);
    return (x, y, z) => ramp(S, 0.5 + y * 0.25 + (f(x * 3, y * 5, z * 3, 3) - 0.5) * 0.35);
  },
  neptune() {
    const f = makeFbm(101), S = R([[0, '#213d94'], [0.5, '#3762c6'], [1, '#6a93ea']]), dark = hex('#152a6a');
    return (x, y, z, lat, lon) => {
      let c = ramp(S, Math.sin(y * 10 + (f(x * 3, y * 3, z * 3, 4) - 0.5) * 2.4) * 0.5 + 0.5);
      let dl = lon - 3; dl = Math.atan2(Math.sin(dl), Math.cos(dl));
      const dx = (dl * Math.cos(lat)) / 0.16, dy = (lat + 20 * DEG) / 0.08, e = dx * dx + dy * dy;
      if (e < 1) c = mixc(c, dark, Math.sqrt(1 - e) * 0.8);
      return c;
    };
  }
};

/* ---------- data (orbital elements at J2000, physical facts) ---------- */
const BODIES = [
  { id: 'sun', name: 'Mặt Trời', en: 'Sun · Sol', color: '#f6b347', R: 5, rotH: 609.1, tilt: 7.25, tex: [512, 256],

function orbitPoint(p, u, r, out) {

  const z = r * (su * Math.sin(i));
  return out.set(x, z, -y);

/* saturn ring texture: C ring, B ring, Cassini division, A ring with Encke gap (radii in 1000 km) */
function ringTexture() {
  const W = 1024, c = document.createElement('canvas'); c.width = W; c.height = 4;
  const g = c.getContext('2d'), img = g.createImageData(W, 4), d = img.data, f = makeFbm(7);
  const cC = hex('#8c7f69'), cB = hex('#e6d6b2'), cA = hex('#cfbd97');
  for (let x = 0; x < W; x++) {
    const rk = 74.5 + (x / (W - 1)) * 62.3, grain = f(x * 0.09, 0, 0, 3);
    let col, a;
    if (rk < 92) { col = cC; a = 0.16 + grain * 0.2; }
    else if (rk < 117.6) { col = cB; a = 0.7 + grain * 0.3; }
    else if (rk < 122.2) { col = cC; a = 0.06; }
    else { col = cA; a = (Math.abs(rk - 133.6) < 0.4 ? 0.1 : 0.5 + grain * 0.25); }
    if (rk > 135.8) a *= clamp((136.8 - rk));
    col = mixc(col, [255, 255, 255], (grain - 0.5) * 0.3);
    for (let y = 0; y < 4; y++) { const k = (y * W + x) * 4; d[k] = col[0]; d[k + 1] = col[1]; d[k + 2] = col[2]; d[k + 3] = a * 255; }
  }
  g.putImageData(img, 0, 0);
  return new THREE.CanvasTexture(c);
}

function startFly(getTarget, toDist, toDir) {
  const off = camera.position.clone().sub(controls.target);
  fly = { t: 0, dur: reduceMotion ? 0 : 1.5, getTarget, from: controls.target.clone(), fromDir: off.clone().normalize(), fromDist: off.length(), toDist, toDir };
}
function select(b) {
  focus = b;
  const p = worldPos(b, new THREE.Vector3());
  let dir;
  if (b.id === 'sun') {
    dir = camera.position.clone().sub(controls.target).normalize();
    dir.y = Math.max(dir.y, 0.35); dir.normalize();
  } else {
    dir = p.clone().negate().setY(0).normalize().applyAxisAngle(UP, 0.65);
    dir.y = 0.42; dir.normalize();
  }
  startFly(() => worldPos(b, tmp2), (b.R * 5 + 2) * (camera.aspect < 1 ? 1.7 : 1), dir);
  lastFocus.copy(p);
  controls.minDistance = b.R * 1.6;
  BODIES.forEach(o => { if (o.orbit) { o.orbit.material.color.set(o === b ? 0xf2a23a : 0x5c6888); o.orbit.material.opacity = o === b ? 0.75 : 0.32; } });
  showInfo(b);
  syncUi();
}
function deselect() {
  if (!focus) return;
  focus = null;
  startFly(() => tmp2.set(0, 0, 0), 150, new THREE.Vector3(0, 0.55, 0.84).normalize());
  controls.minDistance = 8;
  BODIES.forEach(o => { if (o.orbit) { o.orbit.material.color.set(0x5c6888); o.orbit.material.opacity = 0.32; } });
  info.hidden = true;
  document.body.classList.remove('dossier');
  frameView();
  syncUi();
}

/* ---------- picking ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(cx, cy) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(hitMeshes, false)[0];
  return hit ? hit.object.userData.body : null;
}
const canvas = renderer.domElement;
const pointers = new Set();
let tap = null;
canvas.addEventListener('pointerdown', e => {
  pointers.add(e.pointerId);
  tap = pointers.size === 1 ? { x: e.clientX, y: e.clientY, t: performance.now() } : null;
});
canvas.addEventListener('pointerup', e => {
  pointers.delete(e.pointerId);
  if (tap && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) < 8 && performance.now() - tap.t < 600) {
    const b = pick(e.clientX, e.clientY);
    if (b) select(b);
  }
  tap = null;
});
canvas.addEventListener('pointercancel', e => { pointers.delete(e.pointerId); tap = null; });
let hoverQueued = false;
canvas.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || pointers.size || hoverQueued) return;
  hoverQueued = true;
  requestAnimationFrame(() => { hoverQueued = false; canvas.style.cursor = pick(e.clientX, e.clientY) ? 'pointer' : 'grab'; });
});
controls.addEventListener('start', () => { fly = null; dismissHint(); });

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
const info = $('info'), chips = $('chips'), labelsEl = $('labels');
const playBtn = $('play'), speed = $('speed'), speedOut = $('speedOut'), dateEl = $('date');
const ICON_PAUSE = '<svg viewBox="0 0 14 14"><rect x="2" y="1" width="3.5" height="12" rx="1"/><rect x="8.5" y="1" width="3.5" height="12" rx="1"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 14 14"><path d="M3 1.2v11.6a.6.6 0 0 0 .9.5l9.2-5.8a.6.6 0 0 0 0-1L3.9.7a.6.6 0 0 0-.9.5z"/></svg>';

for (const b of BODIES) {
  const c = document.createElement('button');
  c.type = 'button'; c.className = 'chip'; c.style.setProperty('--c', b.color);
  c.innerHTML = '<i></i>'; c.append(b.name);
  c.addEventListener('click', () => (focus === b ? deselect() : select(b)));
  chips.append(c); b.chip = c;

  const l = document.createElement('button');
  l.type = 'button'; l.className = 'lbl'; l.textContent = b.name; l.tabIndex = -1;
  l.addEventListener('click', () => select(b));
  labelsEl.append(l); b.label = l;
}
function syncUi() {
  for (const b of BODIES) {
    b.chip.setAttribute('aria-pressed', String(focus === b));
    b.label.classList.toggle('on', focus === b);
  }
  if (focus) focus.chip.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
}

const SPEED_MIN = -2, SPEED_SPAN = 4.6; // 0,01 → ~400 ngày mỗi giây
const fromSlider = v => Math.pow(10, SPEED_MIN + (SPEED_SPAN * v) / 1000);
const toSlider = d => ((Math.log10(d) - SPEED_MIN) / SPEED_SPAN) * 1000;
const nf = (n, f = 1) => n.toLocaleString('vi-VN', { minimumFractionDigits: f, maximumFractionDigits: f });
function fmtSpeed(d) {
  if (d < 1) return nf(d * 24) + ' giờ / giây';
  if (d < 60) return nf(d) + ' ngày / giây';
  if (d < 365) return nf(d / 30.44) + ' tháng / giây';
  return nf(d / 365.25, 2) + ' năm / giây';
}
function setPlaying(p) {
  playing = p;
  playBtn.innerHTML = p ? ICON_PAUSE : ICON_PLAY;
  playBtn.setAttribute('aria-label', p ? 'Tạm dừng' : 'Chạy tiếp');
}
speed.value = String(Math.round(toSlider(daysPerSec)));
speedOut.textContent = fmtSpeed(daysPerSec);
speed.addEventListener('input', () => { daysPerSec = fromSlider(+speed.value); speedOut.textContent = fmtSpeed(daysPerSec); });
playBtn.addEventListener('click', () => setPlaying(!playing));
$('today').addEventListener('click', () => { simDays = nowDays(); });
$('tOrbits').addEventListener('change', e => { orbitsGroup.visible = e.target.checked; });
$('tLabels').addEventListener('change', e => document.body.classList.toggle('no-labels', !e.target.checked));
$('close').addEventListener('click', deselect);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') deselect();
  if (e.key === ' ' && (e.target === document.body || e.target === canvas)) { e.preventDefault(); setPlaying(!playing); }
});
setPlaying(true);

const hint = $('hint');
hint.textContent = coarse
  ? 'Kéo một ngón để xoay · Chụm hai ngón để phóng to · Chạm vào thiên thể để xem thông tin'
  : 'Kéo để xoay · Cuộn để phóng to · Chuột phải để di chuyển · Bấm vào thiên thể để xem thông tin';
let hintGone = false;
function dismissHint() { if (!hintGone) { hintGone = true; setTimeout(() => hint.classList.add('gone'), 4000); } }

const dateFmt = new Intl.DateTimeFormat('vi-VN', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
let lastDateStr = '';
function updateDate() {
  const t = J2000 + simDays * 864e5;
  const s = Math.abs(t) < 8.64e15 ? dateFmt.format(new Date(t)) : '—';
  if (s !== lastDateStr) { dateEl.textContent = s; lastDateStr = s; }
}

/* dossier */
function lightTime(au) {
  const s = Math.round(au * 499.005);
  if (s < 3600) return `${Math.floor(s / 60)} phút ${s % 60} giây`;
  return `${Math.floor(s / 3600)} giờ ${Math.round((s % 3600) / 60)} phút`;
}
function earthDistAU(b, d) {
  const a = orbitPoint(b, argAt(b, d), b.au, new THREE.Vector3());
  const e = orbitPoint(EARTH, argAt(EARTH, d), 1, new THREE.Vector3());
  return a.distanceTo(e);
}
let liveDd = null;
function showInfo(b) {
  $('iEyebrow').textContent = b.order ? `${b.kind} · thứ ${b.order} tính từ Mặt Trời` : b.kind;
  $('iName').textContent = b.name;
  $('iAlt').textContent = b.en;
  $('iDesc').textContent = b.desc;
  $('iFact').textContent = b.fact;

  const dl = $('iStats');
  dl.replaceChildren();
  const row = (k, v, live) => {
    const dt = document.createElement('dt'), dd = document.createElement('dd');
    dt.textContent = k; dd.textContent = v;
    if (live) dd.className = 'live';
    dl.append(dt, dd);
    return dd;
  };
  b.stats.forEach(([k, v]) => row(k, v));
  if (b.id !== 'sun') row('Ánh sáng Mặt Trời tới nơi', lightTime(b.au));
  liveDd = (b.au && b.id !== 'earth' && b.id !== 'moon') ? row('Cách Trái Đất lúc này', '') : null;
  if (b.id === 'sun') liveDd = null;
  updateLive();

  // size comparison against Earth (or Earth against the Moon)
  const cmp = $('iCompare'), g = $('iCmpG');
  if (b.id === 'sun') { cmp.hidden = true; }
  else {
    cmp.hidden = false;
    const other = b.id === 'earth' ? byId.moon : EARTH;
    const big = b.diam >= other.diam ? b : other, small = big === b ? other : b;
    const rb = 34, rs = Math.max(1.5, (rb * small.diam) / big.diam);
    const cy = 38, xb = 4 + rb, xs = xb + rb + 18 + rs;
    g.innerHTML = '';
    const NS = 'http://www.w3.org/2000/svg';
    for (const [o, x, r] of [[big, xb, rb], [small, xs, rs]]) {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', x); c.setAttribute('cy', cy); c.setAttribute('r', r); c.setAttribute('fill', o.color);
      g.append(c);
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', x + r + 8); t.setAttribute('y', cy + 4); t.setAttribute('fill', '#8a92a6');
      t.setAttribute('font-size', '11'); t.setAttribute('font-family', 'Be Vietnam Pro, system-ui, sans-serif');
      t.textContent = o === big ? '' : o.name;
      g.append(t);
    }
    const ratio = b.diam / other.diam;
    const txt = $('iCmpTxt');
    txt.innerHTML = '';
    txt.append('Đường kính bằng ');
    const bold = document.createElement('b');
    bold.textContent = ratio >= 1 ? nf(ratio, ratio < 10 ? 2 : 1) + '×' : nf(ratio * 100, 0) + '%';
    txt.append(bold, ` ${other.name}`);
  }
  $('iFoot').textContent = /Vệ tinh đã biết/.test(b.stats.map(s => s[0]).join()) ? 'Số vệ tinh được công nhận tính đến năm 2025.' : '';
  info.hidden = false;
  document.body.classList.add('dossier');
  info.scrollTop = 0;
  requestAnimationFrame(frameView);
}
function updateLive() {
  if (!liveDd || !focus) return;
  const au = earthDistAU(focus, simDays);
  liveDd.textContent = `${nf(au, 2)} AU · ${Math.round((au * AU_KM) / 1e6).toLocaleString('vi-VN')} triệu km`;
}

/* ---------- labels ---------- */
const proj = new THREE.Vector3();
function placeLabels() {
  if (document.body.classList.contains('no-labels')) return;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const tanHalf = Math.tan((camera.fov * DEG) / 2);
  for (const b of BODIES) {
    worldPos(b, proj);
    const dist = proj.distanceTo(camera.position);
    let show = true;
    if (b.id === 'moon') show = camera.position.distanceTo(EARTH.pivot.position) < 45 || focus === b;
    proj.project(camera);
    if (proj.z > 1 || proj.x < -1.2 || proj.x > 1.2 || proj.y < -1.2 || proj.y > 1.2) show = false;
    if (!show) { if (b._shown !== false) { b.label.style.display = 'none'; b._shown = false; } continue; }
    if (b._shown !== true) { b.label.style.display = ''; b._shown = true; }
    const pr = (b.R / (dist * tanHalf)) * (h / 2);
    const x = (proj.x * 0.5 + 0.5) * w, y = (-proj.y * 0.5 + 0.5) * h + pr + 4;
    b.label.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translateX(-50%)`;
  }
}

/* ---------- loop ---------- */
/* on phones the dossier is a bottom sheet: shift the projection so the focused body sits in the visible upper part */
function frameView() {
  const w = host.clientWidth, h = host.clientHeight;
  const sheet = !info.hidden && w <= 760 ? Math.min(info.offsetHeight, h * 0.6) : 0;
  if (sheet) camera.setViewOffset(w, h, 0, sheet / 2, w, h);
  else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  frameView();
}
new ResizeObserver(resize).observe(host);
resize();

let prev = performance.now(), liveTimer = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - prev) / 1000);
  prev = now;
  if (playing) simDays += daysPerSec * dt;

  placeBodies(simDays);
  spinBodies(dt);

  if (fly) {
    fly.t += fly.dur ? dt / fly.dur : 1;
    const k = ease(Math.min(1, fly.t));
    const target = fly.getTarget();
    controls.target.copy(fly.from).lerp(target, k);
    const dir = fly.fromDir.clone().lerp(fly.toDir, k);
    if (dir.lengthSq() < 1e-6) dir.copy(fly.toDir);
    dir.normalize();
    camera.position.copy(controls.target).addScaledVector(dir, fly.fromDist + (fly.toDist - fly.fromDist) * k);
    camera.lookAt(controls.target);
    if (focus) lastFocus.copy(target);
    if (fly.t >= 1) fly = null;
  } else {
    if (focus) {
      worldPos(focus, tmp);
      const delta = tmp2.copy(tmp).sub(lastFocus);
      camera.position.add(delta);
      controls.target.add(delta);
      lastFocus.copy(tmp);
    }
    controls.update();
  }

  if (focus) {
    marker.visible = true;
    worldPos(focus, marker.position);
    const s = focus.rings ? focus.R * 1.75 : focus.R;
    marker.scale.setScalar(s);
    marker.quaternion.copy(camera.quaternion);
  } else marker.visible = false;

  updateDate();
  placeLabels();
  liveTimer += dt;
  if (liveTimer > 0.25) { liveTimer = 0; updateLive(); }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
